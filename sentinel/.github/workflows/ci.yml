name: sentinel-ci

on:
  push:
    paths:
      - 'sentinel/**'
  pull_request:
    paths:
      - 'sentinel/**'

defaults:
  run:
    working-directory: sentinel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sentinel/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (state machine + adapter resolve smoke tests)
        run: npm test
